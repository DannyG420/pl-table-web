<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL Table</title>
<meta name="theme-color" content="#37003C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PL Table">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=2.4.2">
</head>
<body>
<div id="bg"></div>
<header id="header">
  <div class="top">
    <div class="titles"><h1 id="title">PL Table</h1><div id="updated">Loading…</div></div>
    <button id="favBtn" class="circle" aria-label="Favourite team">☆</button>
    <button id="setBtn" class="circle" aria-label="Settings">⚙</button>
    <select id="season" aria-label="Season"></select>
  </div>
  <div id="comps" class="chips"></div>
  <div id="favbar"></div>
  <nav id="tabs"></nav>
</header>
<main id="pages"></main>
<div id="overlay" hidden>
  <div class="ohead"><button id="back" aria-label="Back">‹</button><h2 id="otitle"></h2></div>
  <div id="obody"></div>
</div>
<div id="dialog" hidden></div>
<div id="install" hidden>
  <b>Install on iPhone:</b> tap <span class="share">Share ⬆︎</span> then <b>Add to Home Screen</b>.
  <button id="installX">✕</button>
</div>
<script src="app.js?v=2.4.2"></script>
</body>
</html>
